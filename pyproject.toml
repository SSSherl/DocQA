[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-docqa"
version = "0.1.0"
description = "Personal local multimodal document knowledge assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "Pillow>=10,<13", "markdown-it-py>=3,<5", "nh3>=0.3,<1"]
keywords = ["rag", "document-qa", "local-first", "multimodal", "bm25", "retrieval"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/SSSherl/DocQA"
Repository = "https://github.com/SSSherl/DocQA"
Issues = "https://github.com/SSSherl/DocQA/issues"

[project.optional-dependencies]
sparse = ["FlagEmbedding>=1.3,<2"]
test = ["pytest>=8,<10"]
ui-test = ["playwright>=1.50,<2"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools.packages.find]
include = ["docqa*"]

[tool.setuptools.package-data]
docqa = ["web/*.html", "web/vendor/*.js", "web/vendor/*.txt", "*.md"]
